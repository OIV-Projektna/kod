version: "3.8"

services:
  web:
    build: ./webapp
    container_name: vulnerable-web
    ports:
      - "80:80"
    networks:
      mitm-net:
        ipv4_address: 172.20.0.10

  attacker:
    build: ./attacker
    container_name: attacker-tools
    networks:
      mitm-net:
        ipv4_address: 172.20.0.99
    cap_add:
      - NET_ADMIN
      - NET_RAW
    tty: true
    stdin_open: true

networks:
  mitm-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
